<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Vitara Healthcare</title>

    <!-- Google Fonts -->
<!-- Tailwind CSS -->
    <link href="assets/css/vitara.min.css" rel="stylesheet" />

    <!-- Lucide Icons -->
    <script src="assets/js/lucide.min.js"></script>
  </head>
  <body
    class="bg-bg-canvas font-sans text-text-primary antialiased h-screen flex overflow-hidden"
  >
    <!-- Left Side: Image / Branding -->
    <div class="hidden lg:flex lg:w-1/2 relative bg-brand-primary">
      <!-- Background Image -->
      <img
        src="assets/img/hero/hero-1.png"
        alt="Clinic Interior"
        class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-overlay"
      />

      <!-- Gradient Overlay -->
      <div
        class="absolute inset-0 bg-gradient-to-t from-brand-primary/90 via-brand-primary/40 to-transparent"
      ></div>

      <!-- Content -->
      <div
        class="relative z-10 p-12 flex flex-col justify-between h-full w-full"
      >
        <a href="index.html" class="flex items-center gap-2 group w-max">
          <div
            class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform"
          >
            <i data-lucide="cross" class="w-6 h-6 text-brand-primary"></i>
          </div>
          <span
            class="text-2xl font-display font-semibold text-text-inverse tracking-tight"
            >Vitara</span
          >
        </a>

        <div class="max-w-md">
          <h2
            class="text-4xl font-display font-medium text-text-inverse leading-tight mb-6"
          >
            Redefining healthcare with a human touch.
          </h2>
          <div class="flex items-center gap-4">
            <div class="flex -space-x-3">
              <img
                src="assets/img/hero/hero-1.png"
                class="w-10 h-10 rounded-full border-2 border-brand-primary object-cover"
                alt="User"
              />
              <img
                src="assets/img/hero/hero-1.png"
                class="w-10 h-10 rounded-full border-2 border-brand-primary object-cover"
                alt="User"
              />
              <img
                src="assets/img/hero/hero-1.png"
                class="w-10 h-10 rounded-full border-2 border-brand-primary object-cover"
                alt="User"
              />
            </div>
            <p class="text-sm font-medium text-text-inverse/80">
              Trusted by 10,000+ patients
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Side: Login Form -->
    <div
      class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 overflow-y-auto"
    >
      <div class="w-full max-w-md">
        <!-- Mobile Logo -->
        <div class="lg:hidden flex items-center gap-2 mb-8">
          <div
            class="w-10 h-10 rounded-xl bg-brand-primary flex items-center justify-center shadow-sm"
          >
            <i data-lucide="cross" class="w-6 h-6 text-white"></i>
          </div>
          <span
            class="text-2xl font-display font-semibold text-text-primary tracking-tight"
            >Vitara</span
          >
        </div>

        <!-- Header -->
        <div class="mb-8">
          <h1 class="text-3xl font-display font-medium text-text-primary mb-2">
            Welcome back
          </h1>
          <p class="text-text-secondary">
            Please enter your details to sign in.
          </p>
        </div>

        <!-- Role Toggle -->
        <div
          class="flex bg-bg-surface border border-border-default rounded-xl p-1 mb-8"
        >
          <button
            class="flex-1 py-2 text-sm font-medium rounded-lg bg-bg-canvas shadow-sm text-brand-primary transition-all"
          >
            Patient
          </button>
          <button
            class="flex-1 py-2 text-sm font-medium rounded-lg text-text-muted hover:text-text-primary transition-all"
          >
            Clinical Staff
          </button>
        </div>

        <!-- Form -->
        <form action="patient-dashboard.html" class="space-y-5">
          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-text-primary mb-1.5"
              >Email address</label
            >
            <div class="relative">
              <i
                data-lucide="mail"
                class="w-5 h-5 text-text-muted absolute left-3 top-1/2 -translate-y-1/2"
              ></i>
              <input
                type="email"
                id="email"
                class="w-full bg-bg-canvas border border-border-default rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-shadow"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-text-primary mb-1.5"
              >Password</label
            >
            <div class="relative">
              <i
                data-lucide="lock"
                class="w-5 h-5 text-text-muted absolute left-3 top-1/2 -translate-y-1/2"
              ></i>
              <input
                type="password"
                id="password"
                class="w-full bg-bg-canvas border border-border-default rounded-xl pl-10 pr-10 py-3 text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-shadow"
                placeholder="••••••••"
                required
              />
              <button
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-primary transition-colors"
              >
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Options -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                class="rounded border-border-default text-brand-primary focus:ring-brand-primary w-4 h-4 cursor-pointer"
              />
              <span class="text-sm text-text-secondary">Remember me</span>
            </label>
            <a
              href="auth-forgot.html"
              class="text-sm font-medium text-brand-primary hover:text-brand-secondary transition-colors"
              >Forgot password?</a
            >
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full bg-brand-primary text-text-inverse py-3 rounded-xl font-medium hover:bg-brand-secondary transition-colors shadow-sm mt-4"
          >
            Sign In
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-8">
          <div class="flex-1 h-px bg-border-light"></div>
          <span
            class="text-xs font-medium text-text-muted uppercase tracking-wider"
            >or continue with</span
          >
          <div class="flex-1 h-px bg-border-light"></div>
        </div>

        <!-- Social Login -->
        <div class="grid grid-cols-2 gap-4">
          <button
            type="button"
            class="flex items-center justify-center gap-2 bg-bg-surface border border-border-default rounded-xl py-2.5 text-sm font-medium text-text-primary hover:border-border-dark transition-colors"
          >
            <svg
              class="w-5 h-5"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google
          </button>
          <button
            type="button"
            class="flex items-center justify-center gap-2 bg-bg-surface border border-border-default rounded-xl py-2.5 text-sm font-medium text-text-primary hover:border-border-dark transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M13.397 20.997v-8.196h2.765l.411-3.209h-3.176V7.548c0-.926.258-1.56 1.587-1.56h1.684V3.127A22.336 22.336 0 0 0 14.201 3c-2.444 0-4.122 1.492-4.122 4.231v2.355H7.332v3.209h2.753v8.202h3.312z"
              />
            </svg>
            Facebook
          </button>
        </div>

        <!-- Footer Link -->
        <p class="text-center text-sm text-text-secondary mt-8">
          Don't have an account?
          <a
            href="auth-register.html"
            class="font-medium text-brand-primary hover:text-brand-secondary transition-colors"
            >Sign up</a
          >
        </p>
      </div>
    </div>

    <!-- Initialize Icons -->
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
