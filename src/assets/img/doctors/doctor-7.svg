<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <rect width="400" height="500" fill="#fce4ec"/>
  <!-- Background circle -->
  <circle cx="200" cy="175" r="130" fill="#a05c5c" opacity="0.08"/>
  <!-- Doctor silhouette - head -->
  <circle cx="200" cy="145" r="65" fill="#a05c5c" opacity="0.25"/>
  <circle cx="200" cy="143" r="52" fill="#a05c5c" opacity="0.4"/>
  <!-- Doctor silhouette - body -->
  <ellipse cx="200" cy="330" rx="100" ry="90" fill="#a05c5c" opacity="0.2"/>
  <ellipse cx="200" cy="310" rx="85" ry="75" fill="#a05c5c" opacity="0.35"/>
  <!-- White coat indicator -->
  <rect x="148" y="260" width="104" height="110" rx="8" fill="white" opacity="0.5"/>
  <rect x="165" y="260" width="70" height="8" rx="4" fill="#a05c5c" opacity="0.4"/>
  <!-- Cross / medical symbol -->
  <rect x="189" y="285" width="22" height="6" rx="3" fill="#a05c5c" opacity="0.6"/>
  <rect x="197" y="277" width="6" height="22" rx="3" fill="#a05c5c" opacity="0.6"/>
  <!-- Label bar -->
  <rect x="0" y="450" width="400" height="50" fill="#a05c5c" opacity="0.15"/>
  <text x="200" y="481" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#a05c5c" font-weight="600">Dr. Placeholder</text>
</svg>
